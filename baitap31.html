<form onsubmit="handleSubmit(event)">

    <input type="text" id="soDau" placeholder="Nhap so dau">

    <input type="text" id="soCuoi" placeholder="Nhap so cuoi">

    <button type="submit">Submit</button>

</form>

<p id="ketQua"></p>

<script>

function handleSubmit(event)
{

    event.preventDefault();

    const soDau = Number(document.getElementById("soDau").value);

    const soCuoi = Number(document.getElementById("soCuoi").value);

    let tich = 1;

    for (let i = soDau; i <= soCuoi; i++)
    {
        if (i % 7 == 0)
        {
            tich = tich * i;
        }
    }

    document.getElementById("ketQua").innerHTML = tich;

}

</script>
